<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Responsive photo gallery created using CSS Grid.">

  <title>CSS Grid Photo Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    /* CSS Grid Gallery */
    .gallery {
      display: grid;

      /* Four equal columns */
      grid-template-columns: repeat(4, 1fr);

      /* Fixed row height */
      grid-auto-rows: 180px;

      gap: 10px;

      max-width: 1100px;
      margin: 0 auto;
    }

    .gallery figure {
      overflow: hidden;
      border-radius: 10px;
      position: relative;
      background: #222;
    }

    .gallery img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;

      transition: transform 0.4s ease;
    }

    /* Image hover effect */
    .gallery figure:hover img {
      transform: scale(1.08);
    }

    .gallery figcaption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;

      padding: 0.6rem;

      background: rgba(0, 0, 0, 0.65);
      font-size: 0.85rem;
    }

    /* Wide item occupies two columns */
    .wide {
      grid-column: span 2;
    }

    /* Tall item occupies two rows */
    .tall {
      grid-row: span 2;
    }

    /* Big item occupies two columns and two rows */
    .big {
      grid-column: span 2;
      grid-row: span 2;
    }

    /* Tablet */
    @media (max-width: 800px) {
      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      body {
        padding: 1rem;
      }

      .gallery {
        grid-template-columns: 1fr;
        grid-auto-rows: 220px;
      }

      .wide,
      .big {
        grid-column: auto;
      }

      .tall {
        grid-row: auto;
      }
    }
  </style>
</head>

<body>

  <h1>My Photo Gallery</h1>

  <main class="gallery">

    <!-- Big Image -->
    <figure class="big">
      <img
        src="https://picsum.photos/id/1015/800/800"
        alt="River winding through a green valley">

    </figure>

  </main>

</body>
