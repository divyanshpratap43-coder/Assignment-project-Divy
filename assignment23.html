    /* Colour Palette:
       60% Cream  #faf6f0 – background
       30% Navy   #1b2a41 – text and header
       10% Amber  #e09f3e – accents
    */

    :root {
      --cream: #faf6f0;
      --navy: #1b2a41;
      --amber: #e09f3e;
      --muted: #5c6b80;
      --link: #b8751a;
    }

    body {
      margin: 0;
      font-family: 'Source Sans 3', Georgia, sans-serif;
      background: var(--cream);
      color: var(--navy);
      line-height: 1.65;
    }

    h1,
    h2,
    h3 {
      font-family: 'Playfair Display', Georgia, serif;
    }

    header {
      background: var(--navy);
      color: var(--cream);
      padding: 2.5rem 1.5rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2.6rem;
    }

    header p {
      color: var(--amber);
      margin: 0.25rem 0 0;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    h2 {
      color: var(--navy);
      border-bottom: 2px solid var(--amber);
      display: inline-block;
      padding-bottom: 0.15rem;
    }

    h3 {
      margin-bottom: 0;
    }

    .meta {
      color: var(--muted);
      margin-top: 0;
    }

    ul.skills {
      list-style: none;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    ul.skills li {
      background: var(--navy);
      color: var(--cream);
      padding: 0.25rem 0.8rem;
      border-radius: 999px;
      font-weight: 600;
    }

    a {
      color: var(--link);
    }

    footer {
      text-align: center;
      padding: 1rem;
      color: var(--muted);
    }
  </style>
</head>
