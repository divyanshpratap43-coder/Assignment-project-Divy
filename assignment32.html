<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Centered login form for Divyansh Pratap Singh using CSS Flexbox.">

  <title>Login – Divyansh Pratap Singh</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea, #764ba2);
      font-family: system-ui, sans-serif;
      padding: 1rem;
    }

    .login {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      padding: 2rem;
      border-radius: 14px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.25);

      /* Flexbox */
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .login h1 {
      margin: 0;
      text-align: center;
      color: #333;
    }

    .login p {
      margin: 0;
      text-align: center;
      color: #666;
      font-size: 0.9rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-weight: 600;
      color: #333;
    }

    .field input {
      padding: 0.7rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }

    .field input:focus {
      outline: 3px solid #c3b5ff;
      border-color: #764ba2;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .row label {
      font-weight: 500;
    }

    .row a {
      color: #764ba2;
      text-decoration: none;
    }

    .row a:hover {
      text-decoration: underline;
    }

    button {
      padding: 0.8rem;
      border: 0;
      border-radius: 8px;
      background: #764ba2;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #5d3a85;
    }

    .signup {
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }

    .signup a {
      color: #764ba2;
      font-weight: 600;
      text-decoration: none;
    }

    .signup a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <form class="login" action="#" method="post">

    <h1>Welcome Back</h1>

    <p>Login to your account</p>

    <label class="field">
      Email
      <input
        type="email"
        name="email"
        value="divyanshpratap43@gmail.com"
        required
        autocomplete="email">
    </label>

    <label class="field">
      Password
      <input
        type="password"
        name="password"
        required
        minlength="8"
        autocomplete="current-password"
        placeholder="Enter your password">
    </label>

    <div class="row">
      <label>
        <input type="checkbox" name="remember">
        Remember me
      </label>

      <a href="#">Forgot password?</a>
    </div>

    <button type="submit">Log In</button>

    <div class="signup">
      Don't have an account?
      <a href="#">Create Account</a>
    </div>

  </form>

</body>

</html>
