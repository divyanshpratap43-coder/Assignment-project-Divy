<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="description"
    content="Demonstration of CSS custom properties and design tokens.">

  <title>Design Tokens with CSS Variables</title>

  <style>
    /* ===== DESIGN TOKENS ===== */

    :root {
      /* Colours */
      --color-primary: #3d5af1;
      --color-primary-dark: #2b3fb5;
      --color-accent: #ff6b6b;
      --color-bg: #f5f7ff;
      --color-surface: #ffffff;
      --color-text: #1f2430;
      --color-muted: #6b7280;

      /* Font Sizes */
      --fs-sm: 0.8rem;
      --fs-base: 1rem;
      --fs-md: 1.25rem;
      --fs-lg: 1.563rem;
      --fs-xl: 1.953rem;
      --fs-2xl: 2.441rem;

      /* Spacing */
      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 1rem;
      --space-4: 1.5rem;
      --space-5: 2.5rem;

      /* Other Design Tokens */
      --radius: 10px;
      --shadow: 0 4px 14px rgba(31, 36, 48, 0.12);
      --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    /* ===== DARK THEME ===== */

    [data-theme="dark"] {
      --color-bg: #12141c;
      --color-surface: #1e2230;
      --color-text: #eef0f7;
      --color-muted: #9aa3b5;
    }

    /* ===== BASE STYLES ===== */

    body {
      margin: 0;
      padding: var(--space-5);
      font-family: var(--font-body);
      font-size: var(--fs-base);
      line-height: 1.6;
      background: var(--color-bg);
      color: var(--color-text);
      transition: background 0.3s, color 0.3s;
    }

    h1 {
      font-size: var(--fs-2xl);
      margin: 0 0 var(--space-3);
    }

    h2 {
      font-size: var(--fs-lg);
    }

    small {
      font-size: var(--fs-sm);
      color: var(--color-muted);
    }

    /* ===== BUTTONS ===== */

    .btn {
      background: var(--color-primary);
      color: #fff;
      border: none;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius);
      font-size: var(--fs-base);
      cursor: pointer;
    }

    .btn:hover {
      background: var(--color-primary-dark);
    }

    .btn--accent {
      background: var(--color-accent);
    }

    /* ===== CARDS ===== */

    .card {
      background: var(--color-surface);
      padding: var(--space-4);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-block: var(--space-4);
    }

    /* ===== COLOUR SWATCHES ===== */

    .swatches {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
    }

    .swatch {
      width: 90px;
      height: 60px;
      border-radius: var(--radius);
      display: grid;
      place-items: end start;
      padding: var(--space-1);
      font-size: var(--fs-sm);
      color: #fff;
    }
  </style>
</head>
